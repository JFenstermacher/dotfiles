onboarding = false

[ui]
sidebar_collapsed_mode = "hidden"

[keys]
prefix = "ctrl+a"
previous_tab = ""
focus_pane_left = ""
focus_pane_right = ""
focus_pane_down = ""
focus_pane_up = ""
next_tab = ""

[[keys.command]]
key = "prefix+j"
type = "pane"
command = "tv agents"
description = "List agents"

[[keys.command]]
key = "prefix+p"
type = "pane"
command = "tv repositories"
description = "List workspaces"

[[keys.command]]
key = "ctrl+minus"
type = "pane"
command = "tv branches"
description = "List branches"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "yggdrasil.herdr.terminal"
description = "Opens terminal or zooms pane"

[[keys.command]]
key = "prefix+H"
type = "plugin_action"
command = "yggdrasil.herdr.home"
description = "Go to home workspace"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "yggdrasil.herdr.dotfiles"
description = "Go to dotfiles workspace"

[[keys.command]]
key = "prefix+L"
type = "plugin_action"
command = "yggdrasil.herdr.last-workspace"
description = "Toggle last workspace"

[[keys.command]]
key = "prefix+n"
type = "pane"
command = "sessionizer add branch"
description = "Create new worktree (via sessionizer)"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "yggdrasil.herdr.nav-left"
description = "Smart navigate left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "yggdrasil.herdr.nav-down"
description = "Smart navigate down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "yggdrasil.herdr.nav-up"
description = "Smart navigate up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "yggdrasil.herdr.nav-right"
description = "Smart navigate right"

[[keys.command]]
key = "prefix+h"
type = "pane"
command = "sessionizer switch branch main"
description = "Switches to the main branch"

[experimental]
kitty_graphics = true
