[metadata]
name = "repositories"
description = "Lists and interacts with repositories"
requirements = ["sessionizer"]

# UI panel visibility (individual control)
[ui.preview_panel]
hidden = true

[ui.status_bar]
hidden = true

[ui.help_panel]
hidden = true

[ui.remote_control]
disabled = true

[source]
command = "sessionizer list repository"
no_sort = true
frecency = false


[keybindings]
enter = "actions:bare"
ctrl-b = "actions:bare"
ctrl-o = "actions:standard"
ctrl-k = "actions:remove"

[actions.bare]
description = "Enter workspace with bare checkout"
command = "sessionizer switch workspace {}"
mode = "execute"

[actions.standard]
description = "Enter workspace (standard checkout)"
command = "sessionizer add repository {}"
mode = "execute"

[actions.remove]
description = "Removes a workspace"
command = "sessionizer remove repository {}"
mode = "execute"
