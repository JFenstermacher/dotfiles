[metadata]
name = "branches"
description = "Lists branches and workspaces"
requirements = ["sessionizer"]

# UI panel visibility (individual control)
[ui.preview_panel]
hidden = true

[ui.status_bar]
hidden = true

[ui.help_panel]
hidden = true

[ui.remote_control]
disabled = true

[source]
command = "sessionizer list branch"

[keybindings]
enter = "actions:enter"
ctrl-d = "actions:remove"

[actions.enter]
description = "Switch to branch, creates worktree in bare checkouts"
command = "sessionizer switch branch {}"
mode = "execute"

[actions.remove]
description = "Removes branches"
command = "sessionizer remove branch {}"
mode = "execute"
